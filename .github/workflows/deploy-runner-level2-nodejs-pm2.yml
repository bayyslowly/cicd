```yaml
name: "Skenario 2 - Level 2 - Deploy Node.js PM2 (self-hosted VM-B)"

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'skenario2-self-hosted-runner/level2-nodejs-pm2/app/**'

  workflow_dispatch:
    inputs:
      port:
        description: 'Port yang dipakai aplikasi'
        required: true
        default: '4100'
        type: string

jobs:
  deploy:
    name: Deploy Node.js app (PM2) langsung di VM-B
    runs-on: self-hosted

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Cek Node.js dan PM2
        run: |
          node --version
          npm --version
          pm2 --version

      - name: Validasi file aplikasi
        run: |
          test -f skenario2-self-hosted-runner/level2-nodejs-pm2/app/server.js
          test -f skenario2-self-hosted-runner/level2-nodejs-pm2/app/package.json

      - name: Siapkan folder aplikasi
        run: |
          sudo mkdir -p /opt/level2-node-pm2
          sudo chown -R "$(whoami):$(id -gn)" /opt/level2-node-pm2

      - name: Salin file aplikasi
        run: |
          cp skenario2-self-hosted-runner/level2-nodejs-pm2/app/server.js /opt/level2-node-pm2/
          cp skenario2-self-hosted-runner/level2-nodejs-pm2/app/package.json /opt/level2-node-pm2/

      - name: Install dependency aplikasi
        run: |
          cd /opt/level2-node-pm2
          npm install --omit=dev

      - name: Restart dengan PM2
        env:
          APP_PORT: ${{ inputs.port || '4100' }}
        run: |
          cd /opt/level2-node-pm2

          if pm2 describe level2-node-pm2 >/dev/null 2>&1; then
            PORT="$APP_PORT" pm2 restart level2-node-pm2 --update-env
          else
            PORT="$APP_PORT" pm2 start server.js \
              --name level2-node-pm2 \
              --update-env
          fi

          pm2 save

      - name: Verifikasi aplikasi
        env:
          APP_PORT: ${{ inputs.port || '4100' }}
        run: |
          pm2 status
          echo "Aplikasi dikonfigurasi pada port ${APP_PORT}"
          ss -lntp | grep ":${APP_PORT}" || true
